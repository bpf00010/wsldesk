[workspace]
resolver = "2"
members = ["crates/common", "crates/win-host", "crates/wsl-guest"]
# Independent cargo projects that must not join this workspace.
exclude = ["docs"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
uuid = "1"
lz4_flex = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
